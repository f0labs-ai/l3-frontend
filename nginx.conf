# Frontend pod: serve the SPA and reverse-proxy backend traffic. The frontend is
# the only exposed pod; it reaches the backend as http://backend:8000 (the
# ClusterIP Service the backend repo deploys) over the cluster network.

# WebSocket upgrade plumbing (recorder / preview / executor status streams).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static SPA — state-based (not path-based) routing, so unknown paths fall
    # back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # API, including the WebSocket upgrade for long-lived record/preview/execute streams.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Run artifacts (screenshots, report.html / report.pdf).
    location /runs/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
